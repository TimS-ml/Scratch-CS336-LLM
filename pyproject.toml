[project]
name = "scratch-cs336"
version = "0.2.0"
description = "Distributed-first LLM training from scratch (CS336 x Marin, PyTorch)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "draccus>=0.11",
    "huggingface-hub>=0.34",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "regex>=2024.11",
    "safetensors>=0.5",
    "tokenizers>=0.21",
    "torch>=2.13",
    "tqdm>=4.67",
]

[project.optional-dependencies]
# Metric tracking backend (the jsonl tracker needs nothing).
wandb = ["wandb>=0.21"]
# Rollout engine for GRPO on Linux/CUDA hosts.
vllm = ["vllm>=0.11; sys_platform == 'linux'"]
# Dataset download helpers used by experiments/.
datasets = ["datasets>=4.0"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-timeout>=2.4",
    "ruff>=0.12",
    # Reference implementations for numerical parity tests (Qwen3 / Qwen3.5).
    "transformers>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scratch_cs336"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "gpu: requires CUDA",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "F722"]
